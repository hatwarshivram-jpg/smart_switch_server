<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Smart Switch Controller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        .status {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
        }
        .status.ON { color: #2ecc71; }
        .status.OFF { color: #e74c3c; }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #3498db;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #2980b9; }
    </style>
</head>
<body>

<div class="card">
    <h2>Smart Switch</h2>
    <p>Current Status:</p>
    <div id="statusText" class="status OFF">OFF</div>
    <button onclick="toggleLED()">Toggle Switch</button>
</div>

<script>
    async function fetchStatus() {
        try {
            const response = await fetch('/api/led/status');
            const data = await response.json();
            const el = document.getElementById('statusText');
            el.innerText = data.status;
            el.className = 'status ' + data.status;
        } catch (err) {
            console.error('Error fetching status:', err);
        }
    }

    async function toggleLED() {
        try {
            const response = await fetch('/api/led/toggle', { method: 'POST' });
            const data = await response.json();
            const el = document.getElementById('statusText');
            el.innerText = data.status;
            el.className = 'status ' + data.status;
        } catch (err) {
            console.error('Error toggling LED:', err);
        }
    }

    // Poll status every 2 seconds to keep UI synced
    setInterval(fetchStatus, 2000);
    fetchStatus();
</script>

</body>
</html>
